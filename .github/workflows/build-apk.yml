name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -ge 0 ] 2>/dev/null; then
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Detected Java version $JAVA_MAJOR is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: debug.keystore could not be found or generated."
            exit 1
          fi
          echo "Debug keystore confirmed present at $KEYSTORE_PATH"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected debug APK not found at $TARGET_APK."
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is not a regular file or is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $TARGET_APK does not have .apk extension."
              exit 1
              ;;
          esac
          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Verified APK: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -cd 'a-zA-Z0-9._-')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="app"
          fi

          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DESTINATION_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "$ORIGINAL_APK" "$DESTINATION_PATH"

          if [ ! -f "$DESTINATION_PATH" ] || [ ! -s "$DESTINATION_PATH" ]; then
            echo "ERROR: Failed to prepare APK release asset at $DESTINATION_PATH"
            exit 1
          fi

          echo "Copied release asset to $DESTINATION_PATH"
          echo "asset_path=${DESTINATION_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at '$ASSET_PATH'"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have a .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Automated Debug Build
          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset Filename:** ${ASSET_FILENAME}

          > **Notice:** This is an automatically generated debug APK intended for testing purposes only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "")
            echo "=================================================="
            echo "Release Publishing Succeeded!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"
            echo "=================================================="

            {
              echo "## :rocket: Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** \`$RELEASE_TITLE\`"
              echo "- **Release URL:** [Open GitHub Release]($RELEASE_URL)"
              echo "- **Asset Filename:** \`$ASSET_FILENAME\`"
              echo ""
              echo "### :inbox_tray: How to Download"
              echo "1. Go to the [GitHub Release Page]($RELEASE_URL)."
              echo "2. Under the **Assets** section, download \`$ASSET_FILENAME\` directly to your Android device."
              echo ""
              echo "> **Backup:** The normal Actions artifact \`app-debug-apk\` was also successfully uploaded and is available in the workflow summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed or encountered an error. However, the APK was successfully built and uploaded as an Actions artifact."
            echo "Actions artifact 'app-debug-apk' remains available."

            {
              echo "## :warning: Debug APK Build Succeeded (Release Publishing Note)"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` (Available for download)"
              echo "- **Release Note:** Release publishing did not complete, but the debug APK is fully preserved."
              echo ""
              echo "### :inbox_tray: How to Download"
              echo "Download \`app-debug-apk\` from the **Artifacts** section at the bottom of this GitHub Actions run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
